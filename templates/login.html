<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AI Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="center">
  <form class="card login" method="post" action="/login">
    <div class="eyebrow">AI Gateway</div>
    <h1>Sign in</h1>
    <p class="mute">One endpoint for every model, with fallback and usage stats.</p>
    {% if let Some(e) = error %}<div class="flash flash-err" role="alert">{{ e }}</div>{% endif %}
    <label class="field">
      <span>Admin password</span>
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</body>
</html>
