[package]
name = "ai-gateway"
version = "0.1.0"
edition = "2024"
description = "Self-hosted OpenAI-compatible gateway with priority fallback across providers and usage statistics"
license = "MIT"
repository = "https://github.com/Azedevco/ai-gateway"
readme = "README.md"
keywords = ["llm", "openai", "gateway", "proxy", "actix"]
categories = ["web-programming::http-server"]

[dependencies]
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.15.0"
anyhow = "1.0.104"
askama = "0.16.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
